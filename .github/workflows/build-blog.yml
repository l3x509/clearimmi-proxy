name: Build Blog

# Only triggers on markdown sources written by /admin/. The build step's own
# commit touches blog/<slug>.html, blog/index.html, and sitemap.xml — none
# of which match this path, so that follow-up commit does not re-trigger
# this workflow. The "[skip ci]" in the commit message is a second,
# independent layer of protection against that loop if this glob is ever
# broadened later.
on:
  push:
    branches: [main]
    paths: ['blog/posts/**.md']

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:blog

      - name: Commit generated files
        run: |
          git config user.name "clearimmi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/*.html blog/images scripts/generated-posts.json blog/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build: regenerate blog HTML from blog/posts [skip ci]"
          git push
